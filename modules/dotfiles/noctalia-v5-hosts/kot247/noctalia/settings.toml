config_version = 13

[bar.default]
center = [ "clock", "ram", "cpu" ]

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
niri_overview_type_to_launch_enabled = true

[theme]
community_palette = "Gruvbox Material Hard"
source = "community"

[wallpaper]
directory = "/home/arthurb/nix-config/assets/wallpapers/casa"

    [wallpaper.default]
    path = "/home/arthurb/nix-config/assets/wallpapers/casa/wallpaperflare.com_wallpaper.jpg"

    [wallpaper.last]
    path = "/home/arthurb/nix-config/assets/wallpapers/casa/wallpaperflare.com_wallpaper.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/arthurb/nix-config/assets/wallpapers/casa/wallpaperflare.com_wallpaper.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/arthurb/nix-config/assets/wallpapers/casa/wallpaperflare.com_wallpaper.jpg"

[widget.cpu]
enabled = false